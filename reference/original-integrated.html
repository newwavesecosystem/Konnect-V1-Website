<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Konn3ct — Integrated Website & Segment Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --blue:#002882;--green:#64963C;--green-dark:#3F6F24;--navy:#0A1B3D;--cloud:#F7F9FC;
 --white:#fff;--ink:#333A45;--muted:#647185;--line:#DCE4F0;--blue-tint:#EAF1FF;
 --green-tint:#EDF6E6;--header:78px;--subnav:48px;
 --shadow:0 20px 60px rgba(10,27,61,.12);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Inter,Arial,sans-serif;background:#fff;color:var(--ink)}
button,input{font:inherit}button,a{-webkit-tap-highlight-color:transparent}
.site{height:100%;display:flex;flex-direction:column;overflow:hidden}
.global-header{height:var(--header);flex:0 0 auto;background:rgba(255,255,255,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);z-index:60;display:flex;align-items:center}
.header-inner{width:min(calc(100% - 36px),1240px);margin:auto;display:flex;align-items:center;gap:22px;height:100%}
.brand{height:52px;width:204px;border-radius:11px;background:#020711;overflow:hidden;display:flex;align-items:center;padding:3px 8px;flex:0 0 auto;border:1px solid rgba(0,40,130,.08)}
.brand img{width:100%;height:100%;object-fit:contain}
.desktop-nav{display:flex;align-items:center;gap:6px;margin-left:8px}
.nav-btn{height:40px;border:0;background:transparent;border-radius:9px;padding:0 11px;font-size:13px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:5px}
.nav-btn:hover,.nav-btn.active{background:var(--blue-tint);color:var(--blue)}
.chev{font-size:10px;transition:.2s}
.nav-spacer{flex:1}
.login{border:0;background:transparent;color:var(--navy);font-weight:800;font-size:13px;padding:10px}
.start{border:0;background:var(--blue);color:#fff;border-radius:11px;height:42px;padding:0 16px;font-weight:800;font-size:13px}
.menu-btn{display:none;width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--navy)}

/* Solutions mega menu */
.mega-wrap{position:relative}
.mega{position:absolute;top:48px;left:-160px;width:min(760px,82vw);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:12px;display:none;z-index:100}
.mega.open{display:block}
.mega-head{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 11px;border-bottom:1px solid var(--line);margin-bottom:8px}
.mega-head strong{font-family:Sora;color:var(--navy);font-size:14px}
.view-all{border:0;background:transparent;color:var(--blue);font-size:12px;font-weight:800}
.solution-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.solution-link{border:0;background:#fff;border-radius:12px;padding:11px;text-align:left;display:flex;gap:10px;align-items:flex-start;color:var(--ink)}
.solution-link:hover{background:var(--cloud)}
.solution-dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px var(--green-tint);margin:6px 2px 0 3px;flex:0 0 auto}
.solution-link strong{display:block;font-size:12px;color:var(--navy)}
.solution-link small{display:block;font-size:10.5px;line-height:1.4;color:var(--muted);margin-top:3px}

/* Segment context navigation */
.segment-bar{height:var(--subnav);flex:0 0 auto;background:var(--navy);color:#fff;display:none;z-index:40}
.segment-bar.show{display:flex}
.segment-inner{width:min(calc(100% - 36px),1240px);height:100%;margin:auto;display:flex;align-items:center;gap:14px;overflow:hidden}
.breadcrumb{display:flex;align-items:center;gap:7px;white-space:nowrap;font-size:11px;color:#AFC0DB;flex:0 0 auto}
.breadcrumb strong{color:#fff}
.segment-links{display:flex;align-items:center;gap:4px;overflow:auto;scrollbar-width:none;margin-left:auto}
.segment-links::-webkit-scrollbar{display:none}
.segment-link{border:0;background:transparent;color:#C8D5E9;border-radius:8px;padding:8px 9px;font-size:10.5px;font-weight:800;white-space:nowrap}
.segment-link:hover{background:rgba(255,255,255,.08);color:#fff}

/* Content */
.viewport{flex:1;min-height:0;position:relative;background:#fff}
.frame{width:100%;height:100%;border:0;display:block;background:#fff}
.loader{position:absolute;inset:0;display:grid;place-items:center;background:#fff;z-index:10}
.loader-card{border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:var(--shadow);padding:15px 19px;font-size:12px;color:var(--muted)}

/* Mobile */
.mobile-panel{position:fixed;top:var(--header);left:0;right:0;bottom:0;background:#fff;z-index:90;display:none;overflow:auto;padding:14px 18px 28px}
.mobile-panel.open{display:block}
.mobile-nav{display:grid;gap:4px}
.mobile-nav button{border:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 4px;text-align:left;font-weight:800;color:var(--navy)}
.mobile-solutions{margin:10px 0 5px;padding:10px;background:var(--cloud);border-radius:14px}
.mobile-solutions .solution-link{background:transparent}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);background:var(--navy);color:#fff;border-radius:999px;padding:10px 14px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;z-index:200}
.toast.show{opacity:1;transform:translate(-50%,0);transition:.2s}
@media(max-width:1000px){
 .desktop-nav,.login{display:none}
 .menu-btn{display:block}
 .nav-spacer{flex:1}
 .brand{width:178px;height:48px}
 .header-inner{gap:12px}
 .segment-inner{width:calc(100% - 24px)}
 .breadcrumb{display:none}
 .segment-links{margin-left:0}
}
@media(max-width:600px){
 .start{padding:0 12px}
 .brand{width:150px;height:44px}
 .solution-grid{grid-template-columns:1fr}
}
</style>
</head>

function setHash(route){
  const h=route==='home'?'home':route;
  if(location.hash.slice(1)!==h) history.pushState({route},'', '#'+h);
}
function buildSegmentBar(route){
  if(route==='home'){
    segmentBar.classList.remove('show');
    segmentLinks.innerHTML='';
    return;
  }
  document.getElementById('segmentName').textContent=ROUTE_LABELS[route]||route;
  segmentLinks.innerHTML=(SUBNAV[route]||[]).map(x=>`<button class="segment-link" data-segment-anchor="${x.anchor}">${x.label}</button>`).join('');
  segmentLinks.querySelectorAll('[data-segment-anchor]').forEach(b=>b.onclick=()=>scrollModuleTo(b.dataset.segmentAnchor));
  segmentBar.classList.add('show');
}
function scrollModuleTo(anchor){
  try{
    const doc=frame.contentDocument;
    const target=doc?.getElementById(anchor);
    if(target) target.scrollIntoView({behavior:'smooth',block:'start'});
    else frame.contentWindow.location.hash=anchor;
  }catch(e){}
}
function navigate(route,anchor=null,skipHash=false){
  if(!MODULES[route])route='home';
  currentRoute=route;pendingAnchor=anchor;
  mega.classList.remove('open');mobilePanel.classList.remove('open');
  solutionsBtn.classList.toggle('active',route!=='home');
  buildSegmentBar(route);
  loader.style.display='grid';
  loader.querySelector('.loader-card').textContent='Opening '+(ROUTE_LABELS[route]||'Konn3ct')+'…';
  frame.srcdoc=decode(MODULES[route]);
  if(!skipHash)setHash(route);
  frame.onload=()=>{
    loader.style.display='none';
    if(pendingAnchor){
      const a=pendingAnchor;pendingAnchor=null;
      setTimeout(()=>scrollModuleTo(a),80);
    }else{
      try{frame.contentWindow.scrollTo(0,0)}catch(e){}
    }
  };
}
function homeAnchor(anchor){
  if(currentRoute==='home') scrollModuleTo(anchor);
  else navigate('home',anchor);
}

document.getElementById('brandHome').onclick=()=>navigate('home');
document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>navigate(b.dataset.route));
document.querySelectorAll('[data-home-anchor]').forEach(b=>b.onclick=()=>homeAnchor(b.dataset.homeAnchor));
document.querySelectorAll('.solution-link[data-route]').forEach(b=>b.onclick=()=>navigate(b.dataset.route));

solutionsBtn.onclick=e=>{e.stopPropagation();mega.classList.toggle('open')};
document.addEventListener('click',e=>{if(!e.target.closest('.mega-wrap'))mega.classList.remove('open')});
document.getElementById('mobileMenuBtn').onclick=()=>mobilePanel.classList.toggle('open');
document.getElementById('loginBtn').onclick=()=>toast('Login connects to the Konn3ct application sign-in.');

window.addEventListener('message',e=>{
  const d=e.data||{};
  if(d.type==='k3SiteNavigate')navigate(d.route||'home');
  if(d.type==='k3SiteAnchor')navigate(d.route||'home',d.anchor||null);
});

window.addEventListener('hashchange',()=>{
  const route=location.hash.slice(1)||'home';
  if(route!==currentRoute)navigate(route,null,true);
});

const initial=location.hash.slice(1)||'home';
navigate(MODULES[initial]?initial:'home',null,true);
</script>
</body>
</html>
